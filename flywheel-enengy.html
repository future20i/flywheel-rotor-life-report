<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飞轮储能 · 电机电磁耦合模型</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0b0e14;
            color: #e0e4eb;
            margin: 0;
            padding: 12px 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container { max-width: 600px; width: 100%; }
        h1 {
            font-size: 20px; font-weight: 600; margin: 0 0 2px 0;
            color: #b3d4fc; text-align: center;
        }
        .subtitle {
            font-size: 13px; color: #8892a0; text-align: center;
            margin-bottom: 12px; border-bottom: 1px solid #1e2630; padding-bottom: 10px;
        }
        .canvas-wrapper {
            background: #12181f; border-radius: 16px; padding: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); margin-bottom: 12px;
            touch-action: none;
        }
        canvas {
            display: block; width: 100%; height: auto; aspect-ratio: 1 / 0.7;
            background: #0f151c; border-radius: 12px; touch-action: none;
        }
        .legend {
            display: flex; justify-content: center; gap: 18px; font-size: 12px;
            margin-top: -4px; margin-bottom: 12px; color: #a0b0c0;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .color-dot { display: inline-block; width: 16px; height: 4px; border-radius: 4px; }

        .stats {
            display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
            background: #141b23; border-radius: 14px; padding: 8px 4px;
            margin-bottom: 16px; border: 1px solid #232c38;
        }
        .stat-item { text-align: center; }
        .stat-label { font-size: 10px; color: #7b8799; text-transform: uppercase; }
        .stat-value {
            font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
            margin-top: 1px;
        }
        .stat-value.vq { color: #ce93d8; }
        .stat-value.iq { color: #aed581; }
        .stat-value.te { color: #ef5350; }
        .stat-value.omega { color: #4fc3f7; }

        .controls {
            display: flex; flex-direction: column; gap: 14px;
            background: #141b23; border-radius: 16px; padding: 16px 14px;
            border: 1px solid #232c38;
        }
        .slider-group { display: flex; flex-direction: column; gap: 4px; }
        .slider-header {
            display: flex; justify-content: space-between; font-size: 14px;
        }
        .slider-header label { color: #b0c0d0; }
        .slider-header span {
            color: #fff; font-weight: 600; background: #1e2937;
            padding: 0 10px; border-radius: 30px; font-size: 13px;
            min-width: 50px; text-align: center;
        }
        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 6px; border-radius: 10px;
            background: #26303e; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 22px; height: 22px; border-radius: 50%;
            background: #4fc3f7; cursor: pointer;
            border: 2px solid #0b0e14; box-shadow: 0 2px 8px rgba(79, 195, 247, 0.4);
        }
        input[type="range"]::-moz-range-thumb {
            width: 22px; height: 22px; border-radius: 50%;
            background: #4fc3f7; cursor: pointer; border: none;
        }
        .btn-reset {
            background: #2a3748; border: none; color: white;
            font-size: 16px; font-weight: 600; padding: 12px 0;
            border-radius: 60px; margin-top: 6px; cursor: pointer;
            transition: background 0.2s; border: 1px solid #3f4d62;
        }
        .btn-reset:active { background: #3f4d62; transform: scale(0.97); }
        .footer { margin-top: 12px; font-size: 11px; color: #4a5568; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚡ 电压 → 电流 → 转矩</h1>
    <div class="subtitle">PMSM 电磁耦合 · 飞轮储能物理仿真</div>

    <div class="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>
    <div class="legend">
        <span class="legend-item"><span class="color-dot" style="background:#4fc3f7;"></span> 转速 ω</span>
        <span class="legend-item"><span class="color-dot" style="background:#ef5350;"></span> 转矩 Te</span>
        <span class="legend-item"><span class="color-dot" style="background:#aed581;"></span> 电流 Iq</span>
    </div>

    <div class="stats">
        <div class="stat-item"><div class="stat-label">Vq 电压</div><div class="stat-value vq" id="dispVq">0.0</div></div>
        <div class="stat-item"><div class="stat-label">Iq 电流</div><div class="stat-value iq" id="dispIq">0.0</div></div>
        <div class="stat-item"><div class="stat-label">Te 转矩</div><div class="stat-value te" id="dispTe">0.0</div></div>
        <div class="stat-item"><div class="stat-label">转速 ω</div><div class="stat-value omega" id="dispOmega">0.0</div></div>
    </div>

    <div class="controls">
        <div class="slider-group">
            <div class="slider-header"><label>⚡ Vq 幅值 (V)</label><span id="valVq">5.0</span></div>
            <input type="range" id="sliderVq" min="-10" max="10" step="0.1" value="5.0">
        </div>
        <div class="slider-group">
            <div class="slider-header"><label>📶 频率 (Hz)</label><span id="valFreq">0.3</span></div>
            <input type="range" id="sliderFreq" min="0.05" max="2.0" step="0.05" value="0.3">
        </div>
        <div class="slider-group">
            <div class="slider-header"><label>⚙️ 转动惯量 J</label><span id="valJ">0.50</span></div>
            <input type="range" id="sliderJ" min="0.1" max="2.0" step="0.05" value="0.5">
        </div>
        <div class="slider-group">
            <div class="slider-header"><label>🌀 摩擦系数 B</label><span id="valB">0.001</span></div>
            <input type="range" id="sliderB" min="0" max="0.02" step="0.001" value="0.001">
        </div>
        <button class="btn-reset" id="resetBtn">⟳ 重置仿真</button>
    </div>
    <div class="footer">拖动滑块 · 观察 Vq → Iq → Te → ω 的物理链路</div>
</div>

<script>
(function(){
    // ================== 物理参数 ==================
    const params = {
        J: 0.5,          // 转动惯量 (kg·m²)
        B: 0.001,        // 粘性阻尼
        Tc: 0.01,        // 库仑摩擦 (N·m)
        Rs: 0.2,         // 定子电阻 (Ω)
        Lq: 0.005,       // q轴电感 (H)
        Lambda: 0.1,     // 永磁体磁链 (Wb)
        Poles: 2,        // 极对数
        VqAmp: 5.0,      // q轴电压幅值
        Freq: 0.3        // 频率
    };

    // ================== 状态变量 ==================
    let state = {
        omega: 0.0,      // 机械角速度 (rad/s)
        iq: 0.0,         // q轴电流 (A)
        time: 0.0
    };

    // ================== 历史数据缓冲区 ==================
    const MAX_POINTS = 600;
    let historyT = new Array(MAX_POINTS).fill(0);
    let historyOmega = new Array(MAX_POINTS).fill(0);
    let historyTe = new Array(MAX_POINTS).fill(0);
    let historyIq = new Array(MAX_POINTS).fill(0);
    let historyVq = new Array(MAX_POINTS).fill(0);
    let head = 0, count = 0;

    // ================== DOM 引用 ==================
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const dispVq = document.getElementById('dispVq');
    const dispIq = document.getElementById('dispIq');
    const dispTe = document.getElementById('dispTe');
    const dispOmega = document.getElementById('dispOmega');

    const sliderVq = document.getElementById('sliderVq');
    const sliderFreq = document.getElementById('sliderFreq');
    const sliderJ = document.getElementById('sliderJ');
    const sliderB = document.getElementById('sliderB');
    const valVq = document.getElementById('valVq');
    const valFreq = document.getElementById('valFreq');
    const valJ = document.getElementById('valJ');
    const valB = document.getElementById('valB');
    const resetBtn = document.getElementById('resetBtn');

    // ================== 画布自适应 ==================
    function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const width = rect.width - 12;
        const height = width * 0.7;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        canvas.logWidth = width;
        canvas.logHeight = height;
    }

    // ================== 物理更新 (欧拉积分) ==================
    function updatePhysics(dt) {
        const J = params.J, B = params.B, Tc = params.Tc;
        const Rs = params.Rs, Lq = params.Lq, Lambda = params.Lambda;
        const Poles = params.Poles;
        const Vq_amp = params.VqAmp;
        const freq = params.Freq;
        const t = state.time;

        // 1. 输入电压 (正弦)
        const Vq = Vq_amp * Math.sin(2 * Math.PI * freq * t);

        // 2. 反电动势 (关键耦合项)
        const emf = state.omega * Lambda;

        // 3. 电气方程: diq/dt = (Vq - Rs*iq - emf) / Lq
        const diq = (Vq - Rs * state.iq - emf) / Lq;

        // 4. 电磁转矩: Te = 1.5 * Poles * Lambda * iq
        const Te = 1.5 * Poles * Lambda * state.iq;

        // 5. 损耗转矩
        let T_loss = B * state.omega;
        if (Math.abs(state.omega) > 0.001) {
            T_loss += Tc * Math.sign(state.omega);
        } else {
            // 静摩擦力判断：如果转矩不足以克服库仑摩擦，锁死
            if (Math.abs(Te) < Tc) {
                state.omega = 0;
            } else {
                T_loss += Tc * Math.sign(Te); // 假设摩擦方向与驱动力相反
            }
        }

        // 6. 机械方程: domega/dt = (Te - T_loss) / J
        const domega = (Te - T_loss) / J;

        // 7. 积分更新
        state.iq += diq * dt;
        state.omega += domega * dt;
        state.time += dt;

        // 安全限幅
        if (Math.abs(state.omega) > 150) state.omega = 150 * Math.sign(state.omega);
        if (Math.abs(state.iq) > 50) state.iq = 50 * Math.sign(state.iq);

        // 返回当前 Vq 和 Te 用于记录 (Te 已算)
        return { Vq, Te };
    }

    // ================== 记录数据 ==================
    function recordData(Vq, Te) {
        historyT[head] = state.time;
        historyOmega[head] = state.omega;
        historyTe[head] = Te;
        historyIq[head] = state.iq;
        historyVq[head] = Vq;
        head = (head + 1) % MAX_POINTS;
        if (count < MAX_POINTS) count++;
    }

    // ================== 绘图 ==================
    function draw() {
        const W = canvas.logWidth;
        const H = canvas.logHeight;
        ctx.clearRect(0, 0, W, H);

        if (count < 2) {
            ctx.fillStyle = '#4a5568';
            ctx.font = '16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('计算中...', W/2, H/2);
            return;
        }

        const len = count;
        const startIdx = (head - len + MAX_POINTS) % MAX_POINTS;
        let tData = [], omegaData = [], teData = [], iqData = [];

        let minT = Infinity, maxT = -Infinity;
        let maxOmega = 0.1, maxTe = 0.1, maxIq = 0.1;

        for (let i = 0; i < len; i++) {
            const idx = (startIdx + i) % MAX_POINTS;
            const t = historyT[idx];
            const om = historyOmega[idx];
            const te = historyTe[idx];
            const iq = historyIq[idx];
            tData.push(t);
            omegaData.push(om);
            teData.push(te);
            iqData.push(iq);

            if (t < minT) minT = t;
            if (t > maxT) maxT = t;
            if (Math.abs(om) > maxOmega) maxOmega = Math.abs(om);
            if (Math.abs(te) > maxTe) maxTe = Math.abs(te);
            if (Math.abs(iq) > maxIq) maxIq = Math.abs(iq);
        }

        const tRange = Math.max(maxT - minT, 0.5);
        const pad = { top: 20, bottom: 28, left: 14, right: 14 };
        const plotW = W - pad.left - pad.right;
        const plotH = H - pad.top - pad.bottom;

        const toPixel = (t, val, scale) => {
            const x = pad.left + ((t - minT) / tRange) * plotW;
            const y = pad.top + plotH/2 - (val / (scale * 1.1)) * (plotH/2);
            return { x, y };
        };

        // 网格 & 零线
        ctx.strokeStyle = '#1e2630';
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= 4; i++) {
            const y = pad.top + (i / 4) * plotH;
            ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
        }
        ctx.strokeStyle = '#2a3748';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 6]);
        const zeroY = pad.top + plotH/2;
        ctx.beginPath(); ctx.moveTo(pad.left, zeroY); ctx.lineTo(W - pad.right, zeroY); ctx.stroke();
        ctx.setLineDash([]);

        // 绘制三条曲线
        const drawCurve = (data, color, scale, lineWidth = 2.5) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.beginPath();
            for (let i = 0; i < len; i++) {
                const p = toPixel(tData[i], data[i], scale);
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.stroke();
        };

        const omegaScale = Math.max(maxOmega, 0.5);
        const teScale = Math.max(maxTe, 0.5);
        const iqScale = Math.max(maxIq, 0.5);

        drawCurve(omegaData, '#4fc3f7', omegaScale, 3.0);
        drawCurve(teData, '#ef5350', teScale, 2.5);
        drawCurve(iqData, '#aed581', iqScale, 2.5);

        // 轴标签
        ctx.fillStyle = '#6a7a8e';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(minT.toFixed(1) + 's', pad.left, H - 4);
        ctx.fillText(maxT.toFixed(1) + 's', W - pad.right, H - 4);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#4fc3f7';
        ctx.fillText('ω:' + omegaScale.toFixed(1), pad.left - 2, pad.top + 12);
        ctx.fillStyle = '#ef5350';
        ctx.fillText('Te:' + teScale.toFixed(2), pad.left - 2, pad.top + 26);
        ctx.fillStyle = '#aed581';
        ctx.fillText('Iq:' + iqScale.toFixed(1), pad.left - 2, pad.top + 40);
    }

    // ================== 仿真循环 ==================
    let lastTimestamp = 0;
    const DT = 0.004; // 4ms 步长 (电气动态快，需要小步长)

    function simulationLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const elapsed = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        if (elapsed < 0.05) {
            let steps = Math.ceil(elapsed / DT);
            if (steps > 20) steps = 20;
            let lastTe = 0, lastVq = 0;
            for (let i = 0; i < steps; i++) {
                const result = updatePhysics(DT);
                lastVq = result.Vq;
                lastTe = result.Te;
                recordData(lastVq, lastTe);
            }
            // 更新显示数值 (取最新状态)
            dispVq.textContent = lastVq.toFixed(2);
            dispIq.textContent = state.iq.toFixed(2);
            dispTe.textContent = lastTe.toFixed(3);
            dispOmega.textContent = state.omega.toFixed(2);
        }

        draw();
        requestAnimationFrame(simulationLoop);
    }

    // ================== UI 控制 ==================
    function updateParams() {
        params.VqAmp = parseFloat(sliderVq.value);
        params.Freq = parseFloat(sliderFreq.value);
        params.J = parseFloat(sliderJ.value);
        params.B = parseFloat(sliderB.value);
        valVq.textContent = params.VqAmp.toFixed(1);
        valFreq.textContent = params.Freq.toFixed(2);
        valJ.textContent = params.J.toFixed(2);
        valB.textContent = params.B.toFixed(3);
    }

    sliderVq.addEventListener('input', updateParams);
    sliderFreq.addEventListener('input', updateParams);
    sliderJ.addEventListener('input', updateParams);
    sliderB.addEventListener('input', updateParams);

    resetBtn.addEventListener('click', function() {
        state.omega = 0;
        state.iq = 0;
        state.time = 0;
        head = 0;
        count = 0;
        // 填充初始零点
        for (let i = 0; i < 10; i++) {
            recordData(0, 0);
            state.time += DT;
        }
        state.time = 0;
        head = 0; count = 0;
        for (let i = 0; i < 10; i++) {
            recordData(0, 0);
            state.time += DT;
        }
        dispVq.textContent = '0.00';
        dispIq.textContent = '0.00';
        dispTe.textContent = '0.000';
        dispOmega.textContent = '0.00';
    });

    // ================== 初始化 ==================
    function init() {
        resizeCanvas();
        state.omega = 0; state.iq = 0; state.time = 0;
        for (let i = 0; i < 10; i++) {
            recordData(0, 0);
            state.time += DT;
        }
        state.time = 0;
        head = 0; count = 0;
        for (let i = 0; i < 10; i++) {
            recordData(0, 0);
            state.time += DT;
        }
        updateParams();
        lastTimestamp = 0;
        requestAnimationFrame(simulationLoop);
    }

    window.addEventListener('resize', resizeCanvas);
    init();
})();
</script>
</body>
</html>
